site_name: riffy
site_description: A pure Python library for parsing and managing RIFF format files
site_url: https://jmcmeen.github.io/riffy/
repo_url: https://github.com/jmcmeen/riffy
repo_name: jmcmeen/riffy
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Usage: usage.md
  - Recorder Metadata: metadata.md
  - Command-line interface: cli.md
  - Migration (v0.3.0): migration.md
  - API Reference: api.md
