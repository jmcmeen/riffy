version: 2
updates:
  # Every merge to main cuts a release, so updates are grouped into one PR per
  # ecosystem each week. Major dependency bumps still get their own PRs.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only # keep the library's lower bounds as they are
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
