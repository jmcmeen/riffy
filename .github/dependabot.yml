version: 2
updates:
  # Merges to main cut releases, so scheduled updates are grouped into one PR
  # per ecosystem each week. Major bumps and security updates get their own PRs.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only # keep the library's lower bounds as they are
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
