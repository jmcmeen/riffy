[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riffy"
dynamic = ["version"]
description = "A pure Python library for parsing and managing RIFF format files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "John McMeen", email = "johnmcmeen@gmail.com"},
]
keywords = ["riff", "wav", "audio", "parser", "chunk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# No external dependencies - pure Python implementation
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8",
    "mypy>=1.8",
    "build>=1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/jmcmeen/riffy"
Documentation = "https://jmcmeen.github.io/riffy/"
Repository = "https://github.com/jmcmeen/riffy"
Issues = "https://github.com/jmcmeen/riffy/issues"
Changelog = "https://github.com/jmcmeen/riffy/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/riffy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/riffy"]

[tool.hatch.build.targets.wheel.force-include]
"src/riffy/py.typed" = "riffy/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/riffy"]
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
